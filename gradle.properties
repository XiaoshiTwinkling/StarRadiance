# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Acknowledge that this project keeps the Groovy DSL for its shared build script
# (only the Stonecutter controller script is Kotlin).
dev.kikugie.stonecutter.hard_mode=true

# Build tool versions, shared by every Minecraft version.
loom_version=1.14-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.xiaoshi
archives_base_name=starradiance

# Minecraft, Yarn, loader and Fabric API versions are per node:
# see versions/<minecraft version>/gradle.properties
