# Automatically build the project and run the configured checks for every push and pull request.
#
# The job runs once per registered Minecraft version (see settings.gradle). 1.21.1 through 1.21.4
# are ported and must pass; 1.21.8 is only wired up so far and its job is allowed to fail until it
# is ported (see docs/VERSIONING.md).

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.8']
    # Only the not-yet-ported version may fail; the ported ones must stay green.
    continue-on-error: ${{ matrix.version == '1.21.8' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: set active version
        run: ./gradlew "Set active project to ${{ matrix.version }}"
      - name: build and verify
        run: ./gradlew :${{ matrix.version }}:build :${{ matrix.version }}:verifyEphemeris :${{ matrix.version }}:checkLangKeys
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/
