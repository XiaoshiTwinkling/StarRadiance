# Automatically build the project and run the configured checks for every push and pull request.
#
# The job runs once per registered Minecraft version (see settings.gradle). 1.21.4 and 1.21.8 are
# wired up but not ported yet, so their jobs are allowed to fail: remove the `continue-on-error`
# expression once porting is done (see docs/VERSIONING.md).

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['1.21.1', '1.21.4', '1.21.8']
    # Only the ported baseline has to pass; the other entries are scaffolding for now.
    continue-on-error: ${{ matrix.version != '1.21.1' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: set active version
        run: ./gradlew "Set active project to ${{ matrix.version }}"
      - name: build and verify
        run: ./gradlew :${{ matrix.version }}:build :${{ matrix.version }}:verifyEphemeris :${{ matrix.version }}:checkLangKeys
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/
