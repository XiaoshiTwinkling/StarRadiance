pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Kikugie'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Stonecutter turns this project into a multi-version workspace: one shared src/ tree is
	// preprocessed for every Minecraft version registered below.
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	// The shared build script stays Groovy; only the Stonecutter controller is Kotlin (its
	// default), because it has to apply the plugin itself before it can read `stonecutter`.
	centralScript = 'build.gradle'

	create(getRootProject()) {
		versions '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.8'
	}
}
