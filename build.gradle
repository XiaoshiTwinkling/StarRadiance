plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// This build script is shared by every registered Minecraft version (see settings.gradle):
// Stonecutter runs it once per node, and `sc.current.version` tells which one is being built.
// Sources always live in the root src/ tree; version specific values come from
// versions/<version>/gradle.properties.
def minecraftVersion = property('deps.minecraft') as String
def yarnMappings = property('deps.yarn') as String
def loaderVersion = property('deps.loader') as String
def fabricApiVersion = property('deps.fabric_api') as String
def minecraftDependency = property('dep.minecraft') as String

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"starradiance" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings "net.fabricmc:yarn:${yarnMappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
	
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft", minecraftDependency
	inputs.property "loader", loaderVersion

	filesMatching("fabric.mod.json") {
		expand(
			"version": inputs.properties.version,
			"minecraft": inputs.properties.minecraft,
			"loader": inputs.properties.loader
		)
	}
}

// The core shader *definitions* (JSON) cannot carry comments, so they are kept per shader-format
// era and only the matching tree is copied into the jar; the GLSL itself is shared. 1.21.4
// namespaced the program ids ("starradiance:core/sky" instead of "starradiance:sky"), and 1.21.5
// rewrote the pipeline format entirely. Add shader_variants/1.21.5 when porting that version.
def shaderEra = stonecutter.eval(minecraftVersion, '>=1.21.4') ? '1.21.4' : '1.21.1'
processClientResources {
	inputs.property "shaderEra", shaderEra
	// The variant trees are sources for the step below, not resources of their own.
	exclude 'shader_variants/**'
	from(rootProject.file("src/client/resources/shader_variants/${shaderEra}")) {
		into ''
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Headless ephemeris verification (no Minecraft or Fabric on the classpath).
def ephemerisVerificationSources = files(
	rootProject.fileTree('src/main/java/com/xiaoshi/astro'),
	rootProject.file('src/main/java/com/xiaoshi/sky/Celestial.java'),
	rootProject.fileTree('tools/verify')
)

tasks.register('compileEphemerisVerification', JavaCompile) {
	source = ephemerisVerificationSources
	classpath = files()
	destinationDirectory = file('build/verify')
	options.encoding = 'UTF-8'
}

tasks.register('verifyEphemeris', JavaExec) {
	group = 'verification'
	description = 'Checks the ephemeris against published eclipses, moon phases, equinoxes and ranges.'
	classpath = files('build/verify')
	mainClass = 'CelestialVerification'
	dependsOn 'compileEphemerisVerification'
}

tasks.register('checkLangKeys', Exec) {
	group = 'verification'
	description = 'Checks that en_us and zh_cn have identical keys and that every key used in code exists.'
	def findExecutable = { String name ->
		def path = System.getenv('PATH') ?: ''
		path.split(File.pathSeparator).any { dir ->
			new File(dir, name).exists() || new File(dir, name + '.exe').exists()
		}
	}
	workingDir rootProject.projectDir
	commandLine(findExecutable('python3') ? 'python3' : 'python', 'tools/check_lang_keys.py')
}
